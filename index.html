
  <!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zora Recovery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#111;color:white}
.wrap{max-width:600px;margin:auto;padding:20px}
.card{background:#1e1e1e;border-radius:16px;padding:18px;margin-top:14px}
.btn{width:100%;padding:15px;border-radius:12px;border:0;font-weight:700;margin-top:10px;cursor:pointer}
.white{background:white;color:black}
.blue{background:#4F6EF7;color:white}
.input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:white;box-sizing:border-box}
.small{font-size:12px;color:#888;margin-top:6px;word-break:break-all}
.ok{background:#0f2a15;padding:10px;border-radius:10px;font-size:13px;margin-top:10px;word-break:break-all}
.warn{background:#2a1f0f;padding:10px;border-radius:10px;font-size:13px;margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
<h3>Zora Recovery - Safe Mode</h3>
<div id="log" class="small">Ready - Buttons will click ✅</div>

<div class="card">
<button class="btn white" id="connect">1. Connect Wallet (Mainnet)</button>
<div id="addr" class="small"></div>
</div>

<div class="card">
<input id="txhash" class="input" value="0xb93b883f36786cf5fa71f3a3f96c83ca89331ebf5d0835af534f5533e11a4d8b">
<button class="btn blue" id="check">2. Check Status</button>
<div id="result"></div>
</div>

<div class="card" id="actionCard">
<div id="statusText" class="small">Status: not checked</div>
<button class="btn blue" id="proveBtn">3. Prove on L1</button>
<button class="btn white" id="finalizeBtn">4. Finalize (after 7 days)</button>
<div id="out"></div>
</div>
</div>

<script>
// NO MODULE - plain JS so buttons ALWAYS work
let signer, currentTx="0xb93b883f36786cf5fa71f3a3f96c83ca89331ebf5d0835af534f5533e11a4d8b";
let sdk = null;

document.getElementById('log').innerText = "Page loaded, trying SDK...";

// Try load SDK in background - but don't block buttons
(function(){
  const s = document.createElement('script');
  s.src = "https://cdn.jsdelivr.net/npm/@eth-optimism/sdk@3.7.1/dist/browser.js";
  s.onload = () => {
    document.getElementById('log').innerText = "SDK loaded ✅";
    sdk = window.CrossChainMessenger;
  };
  s.onerror = () => {
    // fallback
    const s2 = document.createElement('script');
    s2.src = "https://unpkg.com/@eth-optimism/sdk@3.7.1/dist/browser.js";
    s2.onload = () => {
      document.getElementById('log').innerText = "SDK loaded via unpkg ✅ Turn VPN ON if this fails";
      sdk = window.CrossChainMessenger;
    };
    s2.onerror = () => {
      document.getElementById('log').innerText = "SDK blocked by Airtel - Turn ON Chrome VPN + Cmd+Shift+R";
    };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
})();

document.getElementById('connect').onclick = async()=>{
  try{
    const p = new ethers.BrowserProvider(window.ethereum);
    await p.send("eth_requestAccounts",[]);
    signer = await p.getSigner();
    document.getElementById('addr').innerText = await signer.getAddress();
    try{ await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]});}catch(e){}
    document.getElementById('log').innerText = "Connected: "+ await signer.getAddress();
  }catch(e){ alert(e.message); }
};

document.getElementById('check').onclick = async()=>{
  const hash = document.getElementById('txhash').value.trim();
  currentTx = hash;
  const r = document.getElementById('result');
  r.innerHTML = '<div class="small">Checking Zora RPC...</div>';
  try{
    const zp = new ethers.JsonRpcProvider("https://rpc.zora.energy");
    const rcpt = await zp.getTransactionReceipt(hash);
    if(!rcpt){ r.innerHTML='<div class="warn">Tx not found on Zora</div>'; return; }
    r.innerHTML=`<div class="ok">Found block ${rcpt.blockNumber} ✅<br>Now you can Prove</div>`;
    document.getElementById('statusText').innerText = "Found - Ready to Prove. Turn VPN ON then click Prove";
  }catch(e){ r.innerHTML=`<div class="warn">${e.message}</div>`; }
};

async function getMessenger(){
  if(!signer){
    const p = new ethers.BrowserProvider(window.ethereum);
    await p.send("eth_requestAccounts",[]);
    signer = await p.getSigner();
  }
  const Messenger = window.CrossChainMessenger || window.optimismSDK?.CrossChainMessenger || sdk;
  if(!Messenger) throw new Error("SDK still blocked. Turn ON your Chrome VPN to USA, then hard reload Cmd+Shift+R");
  return new Messenger({
    l1ChainId:1, l2ChainId:7777777,
    l1SignerOrProvider:signer,
    l2SignerOrProvider:new ethers.JsonRpcProvider("https://rpc.zora.energy"),
    bedrock:true
  });
}

document.getElementById('proveBtn').onclick = async()=>{
  const o=document.getElementById('out');
  try{
    o.innerHTML='<div class="warn">Getting status...</div>';
    const m = await getMessenger();
    const status = await m.getMessageStatus(currentTx);
    o.innerHTML=`<div class="small">Status ${status} - Proving now, confirm in MetaMask...</div>`;
    const tx = await m.proveMessage(currentTx);
    o.innerHTML=`<div class="ok">Prove tx: ${tx.hash}<br>Waiting...</div>`;
    await tx.wait();
    o.innerHTML=`<div class="ok">✅ Proven! ${tx.hash}<br>Wait 7 days then Finalize</div>`;
  }catch(e){ o.innerHTML=`<div class="warn">${e.message}</div>`; }
};

document.getElementById('finalizeBtn').onclick = async()=>{
  const o=document.getElementById('out');
  try{
    o.innerHTML='<div class="warn">Finalizing...</div>';
    const m = await getMessenger();
    const tx = await m.finalizeMessage(currentTx);
    o.innerHTML=`<div class="ok">Finalize tx: ${tx.hash}</div>`;
    await tx.wait();
    o.innerHTML=`<div class="ok">✅ Finalized! ETH back</div>`;
  }catch(e){ o.innerHTML=`<div class="warn">${e.message}</div>`; }
};
</script>
</body>
</html>
