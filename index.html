<script type="module">
import { ethers } from 'https://esm.sh/ethers@6.13.2?bundle'
import { CrossChainMessenger, MessageStatus } from 'https://esm.sh/@eth-optimism/sdk@3.7.1?bundle'

let currentTxHash = "";
let messenger = null;

async function ensureMainnet(){
  // Force switch to Ethereum Mainnet for Prove/Finalize
  try{
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }] });
  }catch(e){
    console.log("Switch chain error", e);
  }
}

function getSigner(){
  const provider = new ethers.BrowserProvider(window.ethereum);
  return provider.getSigner();
}

document.getElementById('check').onclick = async()=>{
  const hash = document.getElementById('txhash').value.trim();
  const res = document.getElementById('result');
  if(hash.length!==66){ res.innerHTML='<div class="warn">Invalid hash</div>'; return; }
  currentTxHash = hash;
  res.innerHTML='Checking status... (needs wallet connected)';
  try{
    const signer = await getSigner();
    const l2Provider = new ethers.JsonRpcProvider("https://rpc.zora.energy");
    messenger = new CrossChainMessenger({ 
      l1ChainId: 1, 
      l2ChainId: 7777777, 
      l1SignerOrProvider: signer, 
      l2SignerOrProvider: l2Provider, 
      bedrock: true 
    });
    const status = await messenger.getMessageStatus(hash);
    res.innerHTML=`<div class="ok">Status: <b>${MessageStatus[status]} (${status})</b><br>0=Not ready, 1=Ready to Prove, 2=In Challenge, 3=Ready to Finalize, 6=Relayed</div>`;
    document.getElementById('actionCard').style.display='block';
    // Auto enable buttons
    document.getElementById('actionInfo').innerHTML = `Ready to prove/finalize ${hash.slice(0,10)}...`;
  }catch(e){ res.innerHTML='<div class="warn">Error: '+e.message+'</div>'; console.error(e); }
};

// PROVE - now forces mainnet switch then pops
document.getElementById('proveBtn').onclick = async()=>{
  const r = document.getElementById('actionResult');
  if(!currentTxHash){ r.innerHTML='<div class="warn">Click Check Status first</div>'; return; }
  try{
    await ensureMainnet();
    r.innerHTML='<div class="warn">Proving... calling proveWithdrawalTransaction on OptimismPortal... Check MetaMask pop-up (Mainnet) - needs ~0.001 ETH gas</div>';
    const signer = await getSigner();
    const l2Provider = new ethers.JsonRpcProvider("https://rpc.zora.energy");
    messenger = new CrossChainMessenger({ l1ChainId: 1, l2ChainId: 7777777, l1SignerOrProvider: signer, l2SignerOrProvider: l2Provider, bedrock: true });
    const tx = await messenger.proveMessage(currentTxHash);
    r.innerHTML=`<div class="ok">Prove tx SENT: <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash}</a><br>Waiting confirmation...</div>`;
    await tx.wait();
    r.innerHTML=`<div class="ok">✅ PROVEN! Challenge period started (7 days). You can close. Come back after 7 days and click Finalize. Tx: ${tx.hash}</div>`;
  }catch(e){ 
    console.error(e);
    r.innerHTML='<div class="warn">Prove failed: '+(e.reason||e.message||e)+'<br><br>Common reasons: 1) You are not on Mainnet 2) No ETH for gas 3) Status is not READY_TO_PROVE yet (wait 15 mins after L2 tx)</div>'; 
  }
};

// FINALIZE - forces mainnet
document.getElementById('finalizeBtn').onclick = async()=>{
  const r = document.getElementById('actionResult');
  if(!currentTxHash){ r.innerHTML='<div class="warn">Click Check Status first</div>'; return; }
  try{
    await ensureMainnet();
    r.innerHTML='<div class="warn">Finalizing... calling finalizeWithdrawalTransaction... Check MetaMask pop-up (Mainnet)</div>';
    const signer = await getSigner();
    const l2Provider = new ethers.JsonRpcProvider("https://rpc.zora.energy");
    messenger = new CrossChainMessenger({ l1ChainId: 1, l2ChainId: 7777777, l1SignerOrProvider: signer, l2SignerOrProvider: l2Provider, bedrock: true });
    const tx = await messenger.finalizeMessage(currentTxHash);
    r.innerHTML=`<div class="ok">Finalize tx SENT: <a href="https://etherscan.io/tx/${tx.hash}" target="_blank">${tx.hash}</a></div>`;
    await tx.wait();
    r.innerHTML=`<div class="ok">✅ FINALIZED! Your ETH is back on L1. Tx: ${tx.hash}</div>`;
  }catch(e){ 
    console.error(e);
    r.innerHTML='<div class="warn">Finalize failed: '+(e.reason||e.message||e)+'<br><br>If it says "not ready", your 7 days not over yet. Check status again - must be READY_FOR_RELAY (3)</div>'; 
  }
};
</script>
