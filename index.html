<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zora Recovery - Prove & Finalize</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">
<div class="max-w-lg w-full bg-zinc-900 p-6 rounded-2xl border border-zinc-800">
  <h1 class="text-xl font-bold">Zora Bridge Recovery</h1>
  <p class="text-zinc-400 text-sm mt-1">Paste L2 withdrawal tx, prove + finalize in one place</p>

  <button id="connectButton" class="w-full mt-5 bg-white text-black py-3 rounded-xl font-bold">Connect Wallet</button>
  <div id="walletInfo" class="text-xs text-zinc-400 mt-2 hidden"></div>

  <input id="txHash" placeholder="0x... Zora withdrawal tx hash (L2)" class="w-full mt-5 bg-zinc-800 border border-zinc-700 p-3 rounded-xl text-sm outline-none">

  <button id="proveBtn" class="w-full mt-3 bg-blue-600 py-3 rounded-xl font-bold disabled:opacity-30" disabled>1. Prove Withdrawal on L1</button>
  <button id="finalizeBtn" class="w-full mt-3 bg-green-600 py-3 rounded-xl font-bold disabled:opacity-30" disabled>2. Finalize Withdrawal (after 7 days)</button>

  <div id="status" class="mt-4 text-xs bg-zinc-800 p-3 rounded-xl min-h-[60px]">Status: Connect wallet on Ethereum Mainnet</div>

  <p class="text-[11px] text-zinc-500 mt-4">Uses official Zora OptimismPortal: 0x1a0ad011... (auto). No seed phrase. This just calls proveWithdrawalTransaction + finalizeWithdrawalTransaction for you.</p>
</div>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from 'https://esm.sh/@web3modal/wagmi@4.2.3?bundle'
import { mainnet, zora } from 'https://esm.sh/viem@2.9.32/chains?bundle'
import { reconnect, getAccount, getWalletClient, getPublicClient, switchChain } from 'https://esm.sh/@wagmi/core@2.10.4?bundle'
import { CrossChainMessenger, MessageStatus } from 'https://esm.sh/@eth-optimism/sdk@3.7.1?bundle'
import { http } from 'https://esm.sh/viem@2.9.32?bundle'

const projectId = 'REPLACE_ME' // <-- PASTE YOUR PROJECT ID HERE

const chains = [mainnet, zora]
const metadata = { name: 'Zora Recovery', description: 'Recovery', url: 'https://zorarecovery.netlify.app', icons: [] }
const wagmiConfig = defaultWagmiConfig({ chains, projectId, metadata, transports: { [mainnet.id]: http(), [zora.id]: http('https://rpc.zora.energy') } })
reconnect(wagmiConfig)
const modal = createWeb3Modal({ wagmiConfig, projectId, chains })

const connectBtn = document.getElementById('connectButton')
const proveBtn = document.getElementById('proveBtn')
const finalizeBtn = document.getElementById('finalizeBtn')
const statusEl = document.getElementById('status')
const txInput = document.getElementById('txHash')
const walletInfo = document.getElementById('walletInfo')

function log(t){ statusEl.innerText = t; console.log(t); }

connectBtn.onclick = () => modal.open()
modal.subscribeEvents(e=>{ if(e.data.event==='MODAL_CLOSE'){ const a=getAccount(wagmiConfig); if(a.address){ walletInfo.classList.remove('hidden'); walletInfo.innerText=`Connected: ${a.address.slice(0,6)}...${a.address.slice(-4)} on ${a.chainId}`; proveBtn.disabled=false; log('Connected. Paste your Zora L2 tx hash (the initiate withdrawal tx) and click Prove. Make sure wallet is on Ethereum Mainnet for Prove/Finalize.'); } } })

async function getMessenger(){
  const walletClient = await getWalletClient(wagmiConfig)
  const publicClientL1 = getPublicClient(wagmiConfig, { chainId: mainnet.id })
  const publicClientL2 = getPublicClient(wagmiConfig, { chainId: zora.id })
  const messenger = new CrossChainMessenger({
    l1ChainId: mainnet.id,
    l2ChainId: zora.id,
    l1SignerOrProvider: walletClient,
    l2SignerOrProvider: publicClientL2,
    bedrock: true
  })
  return messenger
}

proveBtn.onclick = async ()=>{
  try{
    const hash = txInput.value.trim()
    if(!hash.startsWith('0x')) return log('Invalid tx hash')
    log('Checking status... fetching proof from Zora...')
    await switchChain(wagmiConfig, { chainId: mainnet.id })
    const messenger = await getMessenger()
    const status = await messenger.getMessageStatus(hash)
    log(`Current status: ${MessageStatus[status]} (${status})`)

    if(status === MessageStatus.READY_TO_PROVE || status === MessageStatus.STATE_ROOT_NOT_PUBLISHED){
      log('Proving withdrawal... this calls proveWithdrawalTransaction on OptimismPortal (L1). Confirm in wallet...')
      const tx = await messenger.proveMessage(hash)
      log(`Prove tx sent: ${tx.hash}. Waiting...`)
      await tx.wait()
      log(`✅ Proven! Tx: ${tx.hash}. Now wait for challenge period (up to 7 days). After that click Finalize.`)
      finalizeBtn.disabled=false
    } else if(status === MessageStatus.IN_CHALLENGE_PERIOD){
      log('Already proven. In challenge period. Wait then Finalize.')
      finalizeBtn.disabled=false
    } else if(status === MessageStatus.READY_FOR_RELAY){
      log('Ready to finalize!')
      finalizeBtn.disabled=false
    } else {
      log(`Status is ${MessageStatus[status]}. If STATE_ROOT_NOT_PUBLISHED, wait a few mins for Zora batcher to post to L1.`)
    }
  }catch(e){ log('Error: '+ (e.shortMessage||e.message)); console.error(e) }
}

finalizeBtn.onclick = async ()=>{
  try{
    const hash = txInput.value.trim()
    log('Finalizing... calls finalizeWithdrawalTransaction on L1. This releases ETH...')
    await switchChain(wagmiConfig, { chainId: mainnet.id })
    const messenger = await getMessenger()
    const tx = await messenger.finalizeMessage(hash)
    log(`Finalize tx sent: ${tx.hash}. Waiting...`)
    await tx.wait()
    log(`✅ FINALIZED! ETH should be in your L1 wallet. Tx: ${tx.hash}`)
  }catch(e){ log('Error: '+ (e.shortMessage||e.message)); console.error(e) }
}
</script>
</body>
</html>
