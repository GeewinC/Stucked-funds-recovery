<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zora Recovery - Safe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:white}
.wrap{max-width:600px;margin:0 auto;padding:24px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:20px;margin-top:16px}
.btn{width:100%;padding:16px;border-radius:12px;border:0;font-weight:700;cursor:pointer;margin-top:10px}
.white{background:white;color:black}
.blue{background:#4F6EF7;color:white}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:white;box-sizing:border-box;margin-top:10px}
.small{font-size:12px;color:#888;margin-top:8px;word-break:break-all}
.ok{background:#0f2a15;border:1px solid #1e4d2b;padding:12px;border-radius:12px;font-size:13px;margin-top:10px;word-break:break-all}
.warn{background:#2a1f0f;border:1px solid #4d3a1e;padding:12px;border-radius:12px;font-size:13px;margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
<h2>Zora Withdrawal Recovery</h2>
<div class="small">Safe - No private key, only MetaMask. Portal: 0x1a0a...1054</div>
<div class="card"><b>Wallet</b><button class="btn white" id="connect">Connect MetaMask (Mainnet)</button><div id="addr" class="small"></div></div>
<div class="card"><b>Your Withdrawal Tx on Zora</b><input id="txhash" class="input" value="0xb93b883f36786cf5fa71f3a3f96c83ca89331ebf5d0835af534f5533e11a4d8b"><button class="btn blue" id="check">Check Status</button><div id="result"></div></div>
<div class="card" id="actionCard" style="display:none"><b>Action</b><div id="statusText" class="small"></div><button class="btn blue" id="proveBtn">1. Prove Withdrawal (needs ETH on L1 for gas)</button><button class="btn white" id="finalizeBtn">2. Finalize after 7 days</button><div id="out"></div></div>
</div>

<script type="module">
// This is the key - we load SDK from esm.run which is bundled and Airtel does NOT block when your Chrome VPN is ON
// This is exactly how zora-community-bridge.vercel.app does it
import { CrossChainMessenger } from "https://esm.run/@eth-optimism/sdk@3.7.1";

window.CrossChainMessenger = CrossChainMessenger;
document.getElementById('statusText').innerText = "SDK ready ✅ (bundled via esm.run)";

let signer, currentTx="";

document.getElementById('connect').onclick = async()=>{
  const p = new ethers.BrowserProvider(window.ethereum);
  await p.send("eth_requestAccounts",[]);
  signer = await p.getSigner();
  document.getElementById('addr').innerText = await signer.getAddress();
  try{ await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]});}catch(e){}
};

document.getElementById('check').onclick = async()=>{
  const hash = document.getElementById('txhash').value.trim();
  currentTx = hash;
  const r = document.getElementById('result');
  try{
    const zp = new ethers.JsonRpcProvider("https://rpc.zora.energy");
    const rcpt = await zp.getTransactionReceipt(hash);
    if(!rcpt){ r.innerHTML='<div class="warn">Tx not found on Zora chain</div>'; return; }
    const l1p = new ethers.JsonRpcProvider("https://eth.llamarpc.com");
    const messenger = new CrossChainMessenger({l1ChainId:1,l2ChainId:7777777,l1SignerOrProvider:l1p,l2SignerOrProvider:zp,bedrock:true});
    const status = await messenger.getMessageStatus(hash);
    const map = {0:"Unconfirmed",1:"Ready to Prove",2:"Waiting 7 days challenge",3:"Ready to Finalize",4:"Finalized / Done"};
    r.innerHTML=`<div class="ok">Found ✅<br>Status: ${status} = ${map[status]||status}</div>`;
    document.getElementById('actionCard').style.display='block';
    document.getElementById('statusText').innerText = `Status: ${map[status]} (${status}) - Block ${rcpt.blockNumber}`;
  }catch(e){ r.innerHTML=`<div class="warn">${e.message}</div>`;}
};

async function getM(){
  if(!signer){ const p=new ethers.BrowserProvider(window.ethereum); await p.send("eth_requestAccounts",[]); signer=await p.getSigner(); }
  try{ await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]});}catch(e){}
  return new CrossChainMessenger({l1ChainId:1,l2ChainId:7777777,l1SignerOrProvider:signer,l2SignerOrProvider:new ethers.JsonRpcProvider("https://rpc.zora.energy"),bedrock:true});
}

document.getElementById('proveBtn').onclick = async()=>{
  const o=document.getElementById('out');
  try{ o.innerHTML='<div class="warn">Proving... confirm on Mainnet</div>'; const m=await getM(); const tx=await m.proveMessage(currentTx); o.innerHTML=`<div class="ok">Prove sent: ${tx.hash}<br>Waiting...</div>`; await tx.wait(); o.innerHTML=`<div class="ok">✅ Proven! Tx: ${tx.hash}<br>Now wait 7 days for challenge</div>`;}catch(e){ o.innerHTML=`<div class="warn">${e.message}</div>`;}
};
document.getElementById('finalizeBtn').onclick = async()=>{
  const o=document.getElementById('out');
  try{ o.innerHTML='<div class="warn">Finalizing... confirm on Mainnet</div>'; const m=await getM(); const tx=await m.finalizeMessage(currentTx); o.innerHTML=`<div class="ok">Finalize sent: ${tx.hash}<br>Waiting...</div>`; await tx.wait(); o.innerHTML=`<div class="ok">✅ Finalized! ETH back on L1. Tx: ${tx.hash}</div>`;}catch(e){ o.innerHTML=`<div class="warn">${e.message}</div>`;}
};
</script>
</body>
</html>
