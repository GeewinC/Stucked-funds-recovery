
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zora Superbridge Replacement - Official</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="https://unpkg.com/@eth-optimism/sdk@3.7.1/dist/browser.js"></script>
<style>
body{margin:0;font-family:Inter,system-ui;background:#f5f5f7}
.wrap{max-width:700px;margin:auto;padding:20px}
.card{background:white;border-radius:20px;padding:24px;margin-top:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.btn{width:100%;padding:16px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.black{background:black;color:white}
.blue{background:#0066FF;color:white}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;box-sizing:border-box;margin-top:10px}
.warn{background:#fff4e5;border:1px solid #ffd080;padding:12px;border-radius:12px;font-size:13px;margin-top:12px;word-break:break-all}
.ok{background:#e8f5e9;border:1px solid #a8d5a2;padding:12px;border-radius:12px;font-size:13px;margin-top:12px;word-break:break-all}
.code{font-family:monospace;background:#f2f2f2;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<div class="wrap">
<h2>Zora Bridge - Superbridge Replacement</h2>
<div class="card"><b>1. Connect</b><br><button class="btn black" id="connect">Connect Wallet</button><div id="addr" class="small" style="margin-top:8px"></div></div>
<div class="card"><b>2. Paste Zora withdrawal tx</b><input id="txhash" class="input" placeholder="0x..." value="0xb93b883f36786cf5fa71f3a3f96c83ca89331ebf5d0835af534f5533e11a4d8b"><button class="btn blue" id="check">Check Status & Prepare Refund</button><div id="result"></div></div>
<div class="card" id="actionCard" style="display:none"><b>3. Refund Action</b><div id="actionInfo"></div><button class="btn blue" id="proveBtn">Step 1: Prove Withdrawal on L1</button><button class="btn black" id="finalizeBtn">Step 2: Finalize After 7 Days</button><div id="actionResult" style="margin-top:12px"></div></div>
</div>

<script>
let signer, currentTxHash = "";
const ZORA_RPC = "https://rpc.zora.energy";

document.getElementById('connect').onclick = async () => {
  if (!window.ethereum) { alert("Open in MetaMask Browser"); return; }
  const provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  document.getElementById('addr').innerText = "Connected: " + await signer.getAddress();
};

document.getElementById('check').onclick = async () => {
  const hash = document.getElementById('txhash').value.trim();
  const res = document.getElementById('result');
  if (hash.length !== 66) { res.innerHTML = '<div class="warn">Invalid hash</div>'; return; }
  currentTxHash = hash;
  res.innerHTML = 'Fetching...';
  try {
    const zp = new ethers.JsonRpcProvider(ZORA_RPC);
    const receipt = await zp.getTransactionReceipt(hash);
    if (!receipt) { res.innerHTML = '<div class="warn">Not found on Zora</div>'; return; }
    res.innerHTML = `<div class="ok">Found ✅ Block ${receipt.blockNumber} - Ready to prove/finalize on L1</div>`;
    document.getElementById('actionCard').style.display = 'block';
  } catch (e) { res.innerHTML = '<div class="warn">'+e.message+'</div>'; }
};

async function getMessenger() {
  if (!window.ethereum) throw new Error("No wallet");
  if (!signer) {
    const p = new ethers.BrowserProvider(window.ethereum);
    await p.send("eth_requestAccounts", []);
    signer = await p.getSigner();
  }
  try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }] }); } catch(e){}
  
  const l2Provider = new ethers.JsonRpcProvider(ZORA_RPC);
  // SDK is loaded via unpkg as window.optimismSDK
  const sdk = window.optimismSDK || window.CrossChainMessenger ? window : window;
  const CrossChainMessenger = (window.optimismSDK && window.optimismSDK.CrossChainMessenger) || window.CrossChainMessenger;
  if (!CrossChainMessenger) throw new Error("SDK not loaded, check internet - unpkg blocked? Try VPN");
  
  return new CrossChainMessenger({
    l1ChainId: 1,
    l2ChainId: 7777777,
    l1SignerOrProvider: signer,
    l2SignerOrProvider: l2Provider,
    bedrock: true
  });
}

document.getElementById('proveBtn').onclick = async () => {
  const r = document.getElementById('actionResult');
  if (!currentTxHash) { r.innerHTML = '<div class="warn">Check first</div>'; return; }
  try {
    r.innerHTML = '<div class="warn">Proving on Mainnet... confirm MetaMask</div>';
    const messenger = await getMessenger();
    const tx = await messenger.proveMessage(currentTxHash);
    r.innerHTML = `<div class="ok">Sent: ${tx.hash} waiting...</div>`;
    await tx.wait();
    r.innerHTML = `<div class="ok">✅ Proven! 7-day challenge started. Tx ${tx.hash}</div>`;
  } catch (e) { r.innerHTML = '<div class="warn">Prove failed: '+(e.reason||e.message)+'</div>'; console.error(e); }
};

document.getElementById('finalizeBtn').onclick = async () => {
  const r = document.getElementById('actionResult');
  if (!currentTxHash) { r.innerHTML = '<div class="warn">Check first</div>'; return; }
  try {
    r.innerHTML = '<div class="warn">Finalizing on Mainnet... confirm MetaMask</div>';
    const messenger = await getMessenger();
    const tx = await messenger.finalizeMessage(currentTxHash);
    r.innerHTML = `<div class="ok">Sent: ${tx.hash}</div>`;
    await tx.wait();
    r.innerHTML = `<div class="ok">✅ Finalized! ETH back on L1. Tx ${tx.hash}</div>`;
  } catch (e) { r.innerHTML = '<div class="warn">Finalize failed: '+(e.reason||e.message)+'</div>'; console.error(e); }
};
</script>
</body>
</html>
